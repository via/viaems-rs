[package]
name = "viaems-ui"
version = "0.1.0"
authors = [""]
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[dependencies]
egui = "0.33"
eframe = { version = "0.33", features=["wgpu", "wayland"]}
emath = { version = "0.33" }
epaint = "0.33"
egui_file = "0.25"
egui_tiles = "0.14"
clap = { version = "4.4.12", features = ["derive"] }

viaems = { path = "../viaems" }
env_logger = "*"
chrono = "*"
